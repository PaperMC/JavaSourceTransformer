name: Deploy
on:
  push:
    tags: [ 'v*' ]

jobs:
  deploy:
    name: Deploy
    runs-on: 'ubuntu-latest'
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      - uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'
          cache: "" # namespace handles this
      - name: Set up cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: gradle
      - name: Setup gradle build cache
        run: |
          nsc cache gradle setup --init-gradle /tmp/init.gradle
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true # namespace handles this
      - name: Deploy
        if: endsWith(steps.get_version.outputs.version, '-SNAPSHOT')
        run: ./gradlew --init-script=/tmp/init.gradle publish --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_paperUsername: ${{ secrets.DEPLOY_USER }}
          ORG_GRADLE_PROJECT_paperPassword: ${{ secrets.DEPLOY_PASS }}
      - name: Parse tag
        id: vars
        run: echo tag=${GITHUB_REF#refs/*/} >> $GITHUB_OUTPUT
      - name: Create release and changelog
        uses: MC-Machinations/auto-release-changelog@v1.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: restamp ${{ steps.vars.outputs.tag }}
          files: |
            build/libs/*.jar
